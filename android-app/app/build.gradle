plugins {
    id "com.android.application"
}

def ridezKeystoreFile = providers.gradleProperty("RIDEZ_KEYSTORE_FILE").orNull
def ridezKeystorePassword = providers.gradleProperty("RIDEZ_KEYSTORE_PASSWORD").orNull

android {
    namespace "dk.ridez.app"
    compileSdk 35

    defaultConfig {
        applicationId "dk.ridez.app.stable"
        minSdk 26
        targetSdk 35
        versionCode 20500
        versionName "2.0.5-solo"
    }

    signingConfigs {
        release {
            if (ridezKeystoreFile && ridezKeystorePassword) {
                storeFile file(ridezKeystoreFile)
                storePassword ridezKeystorePassword
                keyAlias "ridez-release"
                keyPassword ridezKeystorePassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.13.0"
    implementation "androidx.core:core:1.15.0"
}
