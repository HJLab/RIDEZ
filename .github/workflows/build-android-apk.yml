name: Build RIDEZ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-background-gps-v104
      - codex/fix-camera-chat-followers-v108
      - codex/publish-android-v108-apk
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hent projektet
        uses: actions/checkout@v4

      - name: Brug Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Byg debug APK
        run: gradle -p android-app --no-daemon assembleDebug

      - name: Gem APK
        uses: actions/upload-artifact@v4
        with:
          name: RIDEZ-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Udgiv offentlig v108 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk RIDEZ-v108.apk
          if gh release view android-v108 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-v108 RIDEZ-v108.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-v108 RIDEZ-v108.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "RIDEZ Android v108" --notes "Android v108: kamera, repareret chat og live-følgertal."
          fi
