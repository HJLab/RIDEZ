name: Build RIDEZ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-background-gps-v104
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hent projektet
        uses: actions/checkout@v4

      - name: Brug Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Byg debug APK
        run: gradle -p android-app --no-daemon assembleDebug

      - name: Gem APK
        uses: actions/upload-artifact@v4
        with:
          name: RIDEZ-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
