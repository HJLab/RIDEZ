name: Build RIDEZ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/native-live-background-v118
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hent projektet
        uses: actions/checkout@v4

      - name: Brug Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Byg debug APK
        run: gradle -p android-app --no-daemon assembleDebug

      - name: Gem APK
        uses: actions/upload-artifact@v4
        with:
          name: RIDEZ-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Opret direkte v118-download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk RIDEZ-v118.apk
          if gh release view android-v118 >/dev/null 2>&1; then
            gh release upload android-v118 RIDEZ-v118.apk --clobber
          else
            gh release create android-v118 RIDEZ-v118.apk --title "RIDEZ Android v118" --notes "Rigtig live baggrunds-GPS, også mens Kurviger er fremme."
          fi
